services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: magnus
      POSTGRES_DB: magnus
    volumes:
      - magnus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deployment/cloud/Dockerfile
    environment:
      MAGNUS_ENV: production
      DATABASE_URL: postgresql+psycopg://magnus:magnus@db:5432/magnus
      MAGNUS_JWT_SECRET: replace-this-secret
      MAGNUS_ADMIN_USERNAME: admin
      MAGNUS_ADMIN_PASSWORD: replace-this-password
      MAGNUS_CORS_ORIGINS: http://localhost:8501
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  magnus-db:
