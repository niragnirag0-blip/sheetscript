server {
    listen 443 ssl;
    server_name api.example.com;

    # Replace these with the real certificate files. Do not commit the key.
    ssl_certificate /etc/ssl/certs/magnus.crt;
    ssl_certificate_key /etc/ssl/private/magnus.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
